<!-- Employee/Employeeheader.html -->
<header class="main-site-header">
  <div class="header-container">
    <div class="brand-identity">
      <img src="../static/img/avr_logo.png" alt="AVR Logo" class="company-logo" onerror="this.style.display='none'">
      <div class="brand-text">
        <h1 class="company-title">AVR Research and Development Private Limited</h1>
        <span class="portal-subtext">HRMS · Employee Field Portal</span>
      </div>
    </div>
    <div class="header-actions">
      <button onclick="openPasswordModal()" class="secondary" style="color: #fff; border-color: rgba(255,255,255,0.4);">Change Password</button>
      <button onclick="logout()" class="danger">Logout</button>
    </div>
  </div>
</header>
