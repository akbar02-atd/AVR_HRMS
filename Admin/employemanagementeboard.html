<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Status Management · AVR HRMS Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Supabase CDN & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../static/js/config.js"></script>

  <link rel="stylesheet" href="../static/css/styles.css">
  <style>
    .main-site-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
      color: #fff;
      padding: 16px 24px 0;
      border-bottom: 4px solid var(--amber);
      margin-bottom: 24px;
    }
    .header-container {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand-identity { display: flex; align-items: center; gap: 16px; }
    .company-logo { height: 44px; width: auto; object-fit: contain; }
    .company-title { color: #fff; font-size: 18px; margin: 0; }
    .portal-subtext { font-size: 12px; color: #bfcbdc; letter-spacing: .05em; text-transform: uppercase; }

    /* Modal Styles */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(14, 33, 56, 0.6);
      display: none; align-items: center; justify-content: center;
      padding: 16px; z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal-card { width: 100%; max-width: 480px; margin: 0; border-top: 4px solid var(--navy); }

    .main-site-footer {
      background: var(--navy-dark);
      color: #e2e8f0;
      padding: 36px 24px 18px;
      margin-top: 40px;
      border-top: 1px solid var(--rule-strong);
    }
    .footer-container {
      max-width: 1200px; margin: 0 auto;
      display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px;
    }
    .main-site-footer h4 { color: var(--amber); font-size: 15px; margin-bottom: 10px; }
    .footer-address { font-style: normal; font-size: 13.5px; line-height: 1.6; color: #cbd5e1; }
    .footer-contact-list { list-style: none; padding: 0; font-size: 13.5px; }
    .footer-contact-list li { margin-bottom: 8px; }
    .footer-contact-list a { color: #93c5fd; text-decoration: none; }
    .footer-bottom {
      max-width: 1200px; margin: 24px auto 0; padding-top: 16px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15); text-align: center; font-size: 12px; color: #94a3b8;
    }

    /* Custom Inactive Status Badge Tag */
    .status-inactive {
      background: #fdf2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    @media (max-width: 768px) { .footer-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- Dynamic Header -->
  <div id="admin-header-placeholder"></div>

  <main class="container">
    <h2 style="margin-bottom: 6px;">Employee Status Management (EMS)</h2>
    <p class="text-muted" style="margin-bottom: 20px;">Manage active directory permissions, enable or suspend employee login access</p>

    <div class="card">
      <div class="flex-space" style="margin-bottom: 16px;">
        <h3>Employee Directory & Access Control</h3>
        <input type="text" id="searchFilter" placeholder="Search by username or phone..." oninput="filterEmployeeTable()" style="max-width: 280px;">
      </div>

      <div class="table-wrap">
        <table id="emsTable">
          <thead>
            <tr>
              <th>Username</th>
              <th>Contact Number</th>
              <th>Employment Type</th>
              <th>Account Status</th>
              <th>Access Action</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="5" class="empty-state">Loading records…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="admin-footer-placeholder"></div>

  <div id="globalToast"></div>

  <script>
    let rawEmployeeList = [];

    function up(val) { return (val || '').toString().toUpperCase(); }

    let toastTimer;
    function toast(msg, type) {
      const el = document.getElementById('globalToast');
      el.textContent = msg;
      el.className = 'show' + (type ? ' ' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
    }

    function logout() {
      sessionStorage.removeItem('session_user');
      window.location.href = '../index.html';
    }

    (async function init() {
      const cached = sessionStorage.getItem('session_user');
      if (!cached) { window.location.href = '../index.html'; return; }
      const user = JSON.parse(cached);
      if (user.role !== 'admin') { window.location.href = '../index.html'; return; }

      try {
        const [hRes, fRes] = await Promise.all([
          fetch('Adminheader.html'),
          fetch('Adminfooter.html')
        ]);
        if (hRes.ok) {
          document.getElementById('admin-header-placeholder').innerHTML = await hRes.text();
          const activeLink = document.getElementById('nav-employeesmanagement');
          if (activeLink) activeLink.classList.add('active');
        }
        if (fRes.ok) document.getElementById('admin-footer-placeholder').innerHTML = await fRes.text();
      } catch (err) { console.error('Failed loading layout components', err); }

      await fetchEmployees();
    })();

    async function fetchEmployees() {
      const tbody = document.querySelector('#emsTable tbody');
      try {
        const { data, error } = await sb
          .from('users')
          .select('*')
          .or('role.eq.employee,role.eq.user,role.eq.faculty')
          .order('username');

        if (error) throw error;
        rawEmployeeList = data || [];
        renderEmsTable(rawEmployeeList);
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Could not load employee records.</td></tr>`;
      }
    }

    function renderEmsTable(list) {
      const tbody = document.querySelector('#emsTable tbody');
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No matching employees found.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      list.forEach(emp => {
        const tr = document.createElement('tr');

        // Check active status (default to true if undefined)
        const isActive = emp.is_active !== false;

        const statusBadge = isActive
          ? `<span class="status-tag status-approved">Active</span>`
          : `<span class="status-tag status-inactive">Inactive</span>`;

        // Active -> Red "Deactivate" button | Inactive -> Green "Activate" button
        const actionButton = isActive
          ? `<button class="danger" style="padding: 6px 12px; font-size: 12px;" onclick="toggleStatus('${emp.username}', false)">Deactivate</button>`
          : `<button style="background: var(--teal); padding: 6px 12px; font-size: 12px; font-weight:700;" onclick="toggleStatus('${emp.username}', true)">Activate</button>`;

        tr.innerHTML = `
          <td data-label="Username"><b>${emp.username}</b></td>
          <td data-label="Contact Number" class="mono">${emp.phone_number || 'No Contact'}</td>
          <td data-label="Employment Type">${emp.role || 'Freelance'}</td>
          <td data-label="Account Status">${statusBadge}</td>
          <td data-label="Access Action">${actionButton}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterEmployeeTable() {
      const query = document.getElementById('searchFilter').value.toLowerCase().trim();
      const filtered = rawEmployeeList.filter(e => 
        (e.username || '').toLowerCase().includes(query) ||
        (e.phone_number || '').toLowerCase().includes(query)
      );
      renderEmsTable(filtered);
    }

    async function toggleStatus(username, targetState) {
      const actionName = targetState ? 'activate' : 'deactivate';
      if (!confirm(`Are you sure you want to ${actionName} account for ${username}?`)) return;

      try {
        const { error } = await sb
          .from('users')
          .update({ is_active: targetState })
          .eq('username', username);

        if (error) throw error;

        toast(`Account for ${username} is now ${targetState ? 'Active' : 'Inactive'}.`, 'success');
        await fetchEmployees();
      } catch (err) {
        console.error(err);
        toast(`Failed to ${actionName} account.`, 'error');
      }
    }
  </script>
</body>
</html>
